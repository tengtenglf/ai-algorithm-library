name: Import original course and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore: ['content/sync/**']
  pull_request:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Original inbox date YYYY-MM-DD (empty = today in Asia/Shanghai)'
        required: false
        default: ''
        type: string
  schedule:
    # Re-register the two original retry times; cron is UTC.
    - cron: '15 2 * * *'
    - cron: '45 2 * * *'
concurrency:
  group: library-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      publish: ${{ steps.import.outputs.publish }}
      pages_artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Import today's original messages
        id: import
        if: github.event_name != 'pull_request'
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          report="$RUNNER_TEMP/sync-report.json"
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == schedule ]]; then
            args+=(--allow-missing)
          fi
          python scripts/update.py --date "$TARGET_DATE" --report "$report" "${args[@]}"
          if jq -e '.status == "missing_inbox"' "$report" >/dev/null; then
            target_date=$(jq -r '.target_date' "$report")
            echo "::warning title=Missing original course::No original inbox for $target_date. See the import report."
          fi
          if [[ "$GITHUB_EVENT_NAME" != schedule ]] || jq -e '.status == "success" or (.backfilled_dates | length > 0)' "$report" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/review.test.cjs
      - run: python scripts/library.py audit
      - name: Enforce complete original history
        run: python scripts/library.py audit --require-complete
      - run: python scripts/library.py build
      - run: python scripts/library.py links
      - name: Preserve imported originals and ledger
        if: github.event_name != 'pull_request'
        run: |
          git add content/courses content/sync
          if ! git diff --cached --quiet; then
            git -c user.name='library-bot' -c user.email='library-bot@users.noreply.github.com' commit -m 'Import validated original course and sync evidence'
            git push origin HEAD:main
          fi
      - name: Publish run summary
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f "$RUNNER_TEMP/sync-report.json" ]; then
            cat "$RUNNER_TEMP/sync-report.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Import report unavailable; inspect the failed setup/import step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: original-course-sync-evidence
          path: ${{ runner.temp }}/sync-report.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'pull_request' || steps.import.outputs.publish == 'true'
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist
  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified content
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
